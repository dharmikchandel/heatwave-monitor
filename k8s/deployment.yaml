# Minimal Deployment for the college DevOps experiment.
# imagePullPolicy is Never: the image is built directly on the cluster
# node's own container runtime by Jenkins (no registry involved) — see
# README.md "Docker + Kubernetes Image Strategy". Jenkins bumps the tag
# after each build with `kubectl set image`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heatwave-monitor
  labels:
    app: heatwave-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heatwave-monitor
  template:
    metadata:
      labels:
        app: heatwave-monitor
    spec:
      containers:
        - name: heatwave-monitor
          image: heatwave-monitor:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
